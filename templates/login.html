<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevNotes — Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }

    .auth-wrap { width:100%; max-width:400px; padding:20px; }
    .auth-logo { font-family:var(--mono); font-size:22px; font-weight:700; color:var(--accent); text-align:center; margin-bottom:8px; }
    .auth-logo span { color:var(--text2); }
    .auth-subtitle { text-align:center; color:var(--text3); font-size:13px; margin-bottom:32px; }

    .auth-card {
      background:var(--surface); border:1px solid var(--border2);
      border-radius:16px; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .auth-title { font-size:17px; font-weight:700; margin-bottom:22px; color:var(--text); }

    .auth-footer { text-align:center; margin-top:16px; font-size:12px; color:var(--text3); }
    .auth-footer a { color:var(--accent2); text-decoration:none; }
    .auth-footer a:hover { text-decoration:underline; }

    .auth-error {
      background:rgba(255,107,107,.1); border:1px solid rgba(255,107,107,.3);
      border-radius:8px; padding:10px 14px; font-size:12.5px; color:var(--accent3);
      margin-bottom:16px; display:none;
    }

    .btn-full { width:100%; justify-content:center; padding:11px; font-size:14px; }

    .pw-wrap { position:relative; }
    .pw-wrap .form-input { padding-right:40px; }
    .pw-toggle {
      position:absolute; right:10px; top:50%; transform:translateY(-50%);
      background:none; border:none; color:var(--text3); cursor:pointer;
      font-size:15px; padding:4px;
    }
    .pw-toggle:hover { color:var(--text2); }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">dev<span>/</span>notes</div>
    <div class="auth-subtitle">Interview Knowledge Base</div>

    <div class="auth-card">
      <div class="auth-title">🔐 Đăng nhập</div>
      <div class="auth-error" id="authError"></div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" id="username"
               placeholder="Nhập username" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <div class="pw-wrap">
          <input type="password" class="form-input" id="password"
                 placeholder="Nhập mật khẩu" autocomplete="current-password">
          <button class="pw-toggle" type="button" id="togglePw">👁</button>
        </div>
      </div>

      <button class="btn btn-accent btn-full" id="btnLogin">Đăng nhập</button>

      <div class="auth-footer">
        <a href="/forgot-password#reset">Quên mật khẩu?</a>
      </div>
    </div>
  </div>

  <script>
    // Nếu đã đăng nhập → redirect luôn
    (async function() {
      const token = localStorage.getItem("dn_token");
      if (!token) return;
      try {
        const res = await fetch("/api/auth/me", {
          headers: { "Authorization": `Bearer ${token}` },
        });
        if (res.ok) window.location.href = "/";
      } catch {}
    })();

    const errEl  = document.getElementById("authError");
    const btnLog = document.getElementById("btnLogin");

    function showError(msg) {
      errEl.textContent = msg;
      errEl.style.display = "block";
    }

    document.getElementById("togglePw").addEventListener("click", () => {
      const pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    });

    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) { showError("Vui lòng nhập đầy đủ thông tin"); return; }

      btnLog.disabled = true;
      btnLog.textContent = "Đang đăng nhập…";
      errEl.style.display = "none";

      try {
        const res  = await fetch("/api/auth/login", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || "Đăng nhập thất bại"); return; }

        localStorage.setItem("dn_token", data.token);
        localStorage.setItem("dn_user",  data.username);
        window.location.href = "/";
      } catch {
        showError("Lỗi kết nối server");
      } finally {
        btnLog.disabled = false;
        btnLog.textContent = "Đăng nhập";
      }
    }

    btnLog.addEventListener("click", doLogin);
    document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
